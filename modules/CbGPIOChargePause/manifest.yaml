description: >-
  Pauses charging while a digital input is active ("missing release" by a
  higher-level control), by setting an external limit of 0 A on the
  connected energy node.
config:
  pause_gpio_line_name:
    description: GPIO line name of the release input
    type: string
    default: DIGITAL_INPUT_2
  pause_active_low:
    description: Input polarity (true = pause while line is low)
    type: boolean
    default: false
  pause_release_current_A:
    description: Limit sent while not paused (should be >= the node's fuse limit)
    type: number
    default: 80.0
  pause_direction:
    description: Charging direction to be paused (import is charging, export is discharging)
    type: string
    enum:
      - import
      - export
      - both
    default: both
requires:
  energy_sink:
    interface: external_energy_limits
metadata:
  license: https://opensource.org/licenses/Apache-2.0
  authors:
    - chargebyte GmbH
